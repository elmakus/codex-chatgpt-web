name: Fork Linux Release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare compatible Linux libnotify
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
      - name: Publish fork Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          expected="v$(jq -r .version package.json)"
          test "$tag" = "$expected"

          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          mkdir -p release-assets
          cp "$artifact" release-assets/
          asset_name="$(basename "$artifact")"
          (cd release-assets && sha256sum "$asset_name" > checksums.txt)

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing to replace release assets: $tag resolves to $tag_sha, current build is $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$tag" release-assets/"$asset_name" release-assets/checksums.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" release-assets/"$asset_name" release-assets/checksums.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --latest \
              --generate-notes
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets,targetCommitish \
            --jq '{tag: .tagName, target: .targetCommitish, assets: [.assets[].name]}'
